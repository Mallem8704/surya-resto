# Render Blueprint Infrastructure-as-Code Configuration
# Deploy Surya Family Restaurant Kadiri Backend & Managed Database with 1-Click
version: "1"

services:
  # =================================================================
  # FASTAPI BACKEND WEB SERVICE
  # =================================================================
  - type: web
    name: surya-resto-backend
    runtime: python
    region: singapore # or oregon, frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: surya-resto-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://surya-resto.vercel.app,https://frontend-lake-iota-65.vercel.app,http://localhost:3000,http://localhost:3001,http://localhost:3002
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

# =================================================================
# MANAGED POSTGRESQL DATABASE
# =================================================================
databases:
  - name: surya-resto-db
    plan: free
    region: singapore # Match web service region
    databaseName: suryadb
    user: surya_user
