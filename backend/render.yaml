services:
  - type: web
    name: surya-resto-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        value: https://poexygwbosuxbezeastc.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_gmrvTKp0DnRvIbZ6JMTamg_EJjxcMjz
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://surya-resto.vercel.app,https://suryafamilyrestaurant.in,http://localhost:3002
      - key: PYTHON_VERSION
        value: "3.12"
